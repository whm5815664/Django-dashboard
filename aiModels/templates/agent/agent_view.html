{% load static %}
<!DOCTYPE html>
<html>
<head>
    <!-- 页面标题 -->
    <title>智能体问答系统</title>
    <!-- 字符编码设置 -->
    <meta charset="UTF-8">
    <!-- 响应式设计：移动端适配 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* ========== 全局样式重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* ========== 基础样式 ========== */
        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }
        
        /* ========== 背景动画效果 ========== */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.2) 0%, transparent 50%);
            animation: backgroundShift 20s ease-in-out infinite;
            z-index: -1;
        }
        
        @keyframes backgroundShift {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        
        /* ========== 主容器样式 ========== */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* ========== 顶部导航栏 ========== */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* ========== LOGO容器 ========== */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        /* ========== LOGO样式 ========== */
        .logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(120, 219, 255, 0.5));
            transition: all 0.3s ease;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            backdrop-filter: blur(10px);
        }
        
        .logo:hover {
            transform: scale(1.1) rotate(5deg);
            filter: drop-shadow(0 0 30px rgba(120, 219, 255, 0.8));
        }
        
        /* ========== 系统标题 ========== */
        .system-title {
            font-size: 1.8em;
            font-weight: 700;
            background: linear-gradient(135deg, #78dfff, #ff77c6, #7877c6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(120, 219, 255, 0.5);
        }
        
        /* ========== 聊天容器样式 ========== */
        .chat-container {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            padding: 30px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        
        .chat-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(120, 219, 255, 0.5), transparent);
        }
        
        /* ========== 聊天框样式 ========== */
        .chat-box {
            flex: 1;
            min-height: 500px;
            max-height: 600px;
            overflow-y: auto;
            margin-bottom: 25px;
            padding: 25px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }
        
        .chat-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                linear-gradient(45deg, transparent 48%, rgba(120, 219, 255, 0.03) 50%, transparent 52%),
                linear-gradient(-45deg, transparent 48%, rgba(255, 119, 198, 0.03) 50%, transparent 52%);
            pointer-events: none;
        }
        
        /* ========== 滚动条样式 ========== */
        .chat-box::-webkit-scrollbar {
            width: 6px;
        }
        
        .chat-box::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        
        .chat-box::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #78dfff, #ff77c6);
            border-radius: 3px;
        }
        
        .chat-box::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #5acfff, #ff5ab6);
        }
        
        /* ========== 消息基础样式 ========== */
        .message {
            margin-bottom: 20px;
            padding: 20px 25px;
            border-radius: 20px;
            max-width: 85%;
            word-wrap: break-word;
            position: relative;
            animation: messageSlideIn 0.4s ease-out;
            backdrop-filter: blur(10px);
        }
        
        @keyframes messageSlideIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        /* ========== 用户消息样式 ========== */
        .user-message {
            background: linear-gradient(135deg, rgba(120, 219, 255, 0.2), rgba(120, 119, 198, 0.2));
            border: 1px solid rgba(120, 219, 255, 0.3);
            margin-left: auto;
            text-align: left;
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(120, 219, 255, 0.2);
        }
        
        .user-message::before {
            content: '👤';
            position: absolute;
            left: -15px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(120, 219, 255, 0.8);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        
        /* ========== 机器人消息样式 ========== */
        .bot-message {
            background: linear-gradient(135deg, rgba(255, 119, 198, 0.1), rgba(120, 119, 198, 0.1));
            border: 1px solid rgba(255, 119, 198, 0.2);
            margin-right: auto;
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(255, 119, 198, 0.1);
        }
        
        .bot-message::before {
            content: '🤖';
            position: absolute;
            right: -15px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 119, 198, 0.8);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        
        /* ========== 输入区域样式 ========== */
        .input-area {
            display: flex;
            gap: 15px;
            align-items: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        
        /* ========== 问题输入框样式 ========== */
        #question {
            flex-grow: 1;
            padding: 18px 25px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.3);
            color: #ffffff;
            transition: all 0.3s ease;
            outline: none;
            backdrop-filter: blur(10px);
        }
        
        #question:focus {
            border-color: rgba(120, 219, 255, 0.6);
            box-shadow: 0 0 20px rgba(120, 219, 255, 0.3);
            background: rgba(0, 0, 0, 0.4);
        }
        
        #question::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        /* ========== 按钮基础样式 ========== */
        button {
            padding: 18px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            outline: none;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        button:hover::before {
            left: 100%;
        }
        
        /* ========== 发送按钮样式 ========== */
        #send-btn {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #000000;
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.3);
        }
        
        #send-btn:hover {
            background: linear-gradient(135deg, #00cc6a, #00aa55);
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(0, 255, 136, 0.4);
        }
        
        #send-btn:disabled {
            background: linear-gradient(135deg, #666666, #444444);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        /* ========== 语音按钮样式 ========== */
        #voice-btn {
            background: linear-gradient(135deg, #78dfff, #5acfff);
            color: #000000;
            box-shadow: 0 8px 25px rgba(120, 219, 255, 0.3);
        }
        
        #voice-btn:hover {
            background: linear-gradient(135deg, #5acfff, #3abfff);
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(120, 219, 255, 0.4);
        }
        
        #voice-btn.listening {
            background: linear-gradient(135deg, #ff77c6, #ff5ab6);
            animation: voicePulse 1.5s infinite;
        }
        
        #voice-btn.disabled {
            background: linear-gradient(135deg, #666666, #444444);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        @keyframes voicePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        /* ========== 强制结束按钮样式 ========== */
        #stop-btn {
            background: linear-gradient(135deg, #ff4757, #ff3742);
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(255, 71, 87, 0.3);
            display: none;
        }
        
        #stop-btn:hover {
            background: linear-gradient(135deg, #ff3742, #ff2f3a);
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(255, 71, 87, 0.4);
        }
        
        #stop-btn::before {
            content: '⏹';
            font-size: 16px;
            margin-right: 8px;
        }
        
        /* ========== 思考中状态样式 ========== */
        .thinking {
            color: rgba(255, 255, 255, 0.7);
            font-style: italic;
            animation: thinkingPulse 1.5s infinite;
        }
        
        @keyframes thinkingPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        
        /* ========== 机器人回复内容格式化样式 ========== */
        .bot-content {
            white-space: pre-wrap;
        }
        
        .bot-content p {
            margin: 8px 0;
            line-height: 1.5;
        }
        
        .bot-content pre {
            background: rgba(0, 0, 0, 0.4);
            color: #78dfff;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 16px 0;
            border-left: 4px solid #78dfff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        
        .bot-content code {
            font-family: 'Fira Code', 'Courier New', monospace;
            background: rgba(120, 219, 255, 0.2);
            color: #78dfff;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.9em;
        }
        
        .bot-content blockquote {
            border-left: 4px solid #ff77c6;
            padding: 20px;
            color: rgba(255, 255, 255, 0.8);
            margin: 16px 0;
            background: rgba(255, 119, 198, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        .bot-content h1, .bot-content h2, .bot-content h3 {
            margin: 20px 0 12px;
            color: #ffffff;
            font-weight: 600;
        }
        
        .bot-content h1 {
            font-size: 1.5em;
            border-bottom: 2px solid #78dfff;
            padding-bottom: 8px;
        }
        
        .bot-content h2 {
            font-size: 1.3em;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 6px;
        }
        
        /* ========== 思考过程样式 ========== */
        .reasoning-section {
            margin: 6px 0;
            padding: 8px 12px;
            background: rgba(120, 119, 198, 0.15);
            border: 1px solid rgba(120, 119, 198, 0.3);
            border-radius: 8px;
            font-size: 0.85em;
            color: rgba(200, 200, 220, 0.8);
            line-height: 1.0;
            font-family: ui-monospace, 'Cascadia Code', 'Consolas', monospace;
            white-space: pre-wrap; /* 命令输出/推理过程保留换行 */
        }

        .reasoning-section strong {
            color: rgba(180, 180, 220, 0.9);
            font-size: 0.9em;
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .text-section {
            margin: 6px 0;
        }

        .text-section strong {
            color: rgba(255, 255, 255, 0.95);
            font-size: 1em;
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
        }
        
        /* ========== 欢迎消息特殊样式 ========== */
        .welcome-message .bot-content p {
            margin: 6px 0;
            line-height: 1.4;
            font-size: 1.1em;
        }
        
        .welcome-message .bot-content p:first-child {
            margin-top: 0;
        }
        
        .welcome-message .bot-content p:last-child {
            margin-bottom: 0;
        }
        
        /* ========== 返回按钮样式 ========== */
        .back-button {
            position: relative;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            text-decoration: none;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            font-weight: 500;
            font-size: 14px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .back-link:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            color: #78dfff;
        }
        
        .back-link i {
            font-size: 16px;
        }

        /* 顶部：返回 + 刷新 */
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1000;
        }

        .refresh-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            font-weight: 500;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            color: #78dfff;
        }

        /* ========== 停止确认UI样式 ========== */
        .stop-confirmation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            padding: 30px;
            text-align: center;
            z-index: 10001;
            backdrop-filter: blur(20px);
            min-width: 300px;
        }

        .stop-confirmation h3 {
            color: #ffffff;
            margin-bottom: 20px;
            font-size: 1.3em;
            font-weight: 600;
        }

        .stop-confirmation p {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 25px;
            font-size: 1.1em;
            line-height: 1.5;
        }

        .voice-hint {
            color: rgba(120, 219, 255, 0.8) !important;
            font-size: 0.9em !important;
            margin-bottom: 20px !important;
            font-style: italic;
            animation: voiceHintPulse 2s infinite;
        }

        @keyframes voiceHintPulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        .confirmation-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .confirmation-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            outline: none;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            min-width: 80px;
        }

        .confirmation-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .confirmation-btn:hover::before {
            left: 100%;
        }

        .confirm-yes {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #000000;
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.3);
        }

        .confirm-yes:hover {
            background: linear-gradient(135deg, #00cc6a, #00aa55);
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(0, 255, 136, 0.4);
        }

        .confirm-no {
            background: linear-gradient(135deg, #ff4757, #ff3742);
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(255, 71, 87, 0.3);
        }

        .confirm-no:hover {
            background: linear-gradient(135deg, #ff3742, #ff2f3a);
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(255, 71, 87, 0.4);
        }

        .stop-confirmation-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10000;
            backdrop-filter: blur(10px);
        }
        
        /* ========== 响应式设计 ========== */
        @media (max-width: 768px) {
            .main-container {
                padding: 10px;
            }
            
            .top-nav {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .logo {
                width: 60px;
                height: 60px;
            }
            
            .system-title {
                font-size: 1.4em;
            }
            
            .chat-container {
                padding: 20px;
                border-radius: 20px;
            }
            
            .chat-box {
                min-height: 400px;
                padding: 20px;
            }
            
            .input-area {
                flex-direction: column;
                gap: 12px;
            }
            
            button {
                width: 100%;
                padding: 16px 20px;
            }

            .nav-actions .refresh-btn {
                width: auto;
                padding: 12px 20px;
            }
            
            #question {
                padding: 16px 20px;
            }
        }
        
        /* ========== 加载动画 ========== */
        .loading-dots {
            display: inline-block;
        }
        
        .loading-dots::after {
            content: '';
            animation: loadingDots 1.5s infinite;
        }
        
        @keyframes loadingDots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
        
        /* ========== 科技感装饰元素 ========== */
        .tech-decoration {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 2px solid rgba(120, 219, 255, 0.3);
            border-radius: 50%;
            animation: rotate 20s linear infinite;
        }
        
        .tech-decoration:nth-child(1) {
            top: 10%;
            right: 10%;
            animation-delay: 0s;
        }
        
        .tech-decoration:nth-child(2) {
            bottom: 20%;
            left: 5%;
            animation-delay: -10s;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ========== Agent 回答区 Markdown 渲染（深色主题，紧凑行距） ========== */
        .bot-content .markdown-body {
            margin-top: 4px;
            line-height: 1.4;
            white-space: normal;
            color: rgba(255, 255, 255, 0.92);
            font-size: 0.95em;
            overflow-x: auto;
        }

        .bot-content .markdown-body > :first-child {
            margin-top: 0;
        }

        .bot-content .markdown-body > :last-child {
            margin-bottom: 0;
        }

        .bot-content .markdown-body h1 {
            font-size: 1.35em;
            margin: 0.5em 0 0.28em;
            color: #c8f0ff;
            font-weight: 700;
        }

        .bot-content .markdown-body h2 {
            font-size: 1.22em;
            margin: 0.48em 0 0.26em;
            color: #b8e8ff;
            font-weight: 600;
            border-bottom: 1px solid rgba(120, 219, 255, 0.25);
            padding-bottom: 0.22em;
        }

        .bot-content .markdown-body h3 {
            font-size: 1.08em;
            margin: 0.42em 0 0.22em;
            color: rgba(200, 230, 255, 0.95);
            font-weight: 600;
        }

        .bot-content .markdown-body h4,
        .bot-content .markdown-body h5,
        .bot-content .markdown-body h6 {
            margin: 0.35em 0 0.18em;
            color: rgba(210, 225, 255, 0.9);
            font-weight: 600;
        }

        .bot-content .markdown-body p {
            margin: 0.2em 0;
            line-height: 1.4;
        }

        /* 修复：避免 strong 被全局样式意外改成块级导致换行 */
        .bot-content .markdown-body strong {
            display: inline;
        }

        .bot-content .markdown-body ul,
        .bot-content .markdown-body ol {
            margin: 0.22em 0 0.22em 1.15em;
            padding-left: 0.45em;
        }

        .bot-content .markdown-body li {
            margin: 0.1em 0;
            line-height: 1.38;
        }

        .bot-content .markdown-body li > p {
            margin: 0.1em 0;
        }

        .bot-content .markdown-body table {
            border-collapse: collapse;
            width: 100%;
            max-width: 100%;
            margin: 0.35em 0;
            font-size: 0.9em;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 8px;
            overflow: hidden;
        }

        .bot-content .markdown-body th,
        .bot-content .markdown-body td {
            border: 1px solid rgba(120, 219, 255, 0.28);
            padding: 5px 8px;
            text-align: left;
            vertical-align: top;
        }

        .bot-content .markdown-body th {
            background: rgba(120, 219, 255, 0.14);
            color: #9ee7ff;
            font-weight: 600;
        }

        .bot-content .markdown-body tbody tr:nth-child(even) td {
            background: rgba(255, 255, 255, 0.04);
        }

        .bot-content .markdown-body code {
            background: rgba(0, 0, 0, 0.35);
            padding: 0.15em 0.4em;
            border-radius: 4px;
            font-size: 0.9em;
            font-family: ui-monospace, 'Cascadia Code', 'Consolas', monospace;
        }

        .bot-content .markdown-body pre {
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 10px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 0.35em 0;
            line-height: 1.35;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .bot-content .markdown-body pre code {
            background: none;
            padding: 0;
            font-size: 0.88em;
        }

        .bot-content .markdown-body blockquote {
            margin: 0.25em 0;
            padding: 0.2em 0 0.2em 10px;
            border-left: 3px solid rgba(120, 219, 255, 0.45);
            color: rgba(220, 220, 240, 0.88);
        }

        .bot-content .markdown-body a {
            color: #78dfff;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .bot-content .markdown-body hr {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            margin: 0.45em 0;
        }
    </style>
</head>
<body>
    <!-- 科技感装饰元素 -->
    <div class="tech-decoration"></div>
    <div class="tech-decoration"></div>
    
    <!-- ========== 主容器 ========== -->
    <div class="main-container">
        <!-- ========== 顶部导航栏 ========== -->
        <div class="top-nav">
            <!-- LOGO和标题容器 -->
            <div class="logo-container">
                <!-- AIoT实验室LOGO -->
                <img src="{% static 'images/AIoT实验室LOGO.png' %}" alt="AIoT实验室" class="logo">
                <!-- 系统标题 -->
                <div class="system-title">智能体问答系统</div>
            </div>
            
            <!-- 返回 / 刷新 -->
            <div class="nav-actions">
                <div class="back-button">
                    <a href="javascript:history.back()" class="back-link">
                        <i class="fa fa-arrow-left"></i> 返回
                    </a>
                </div>
                <button type="button" class="refresh-btn" onclick="location.reload()" title="刷新页面">🔄 刷新</button>
            </div>
        </div>

        <!-- ========== 聊天容器 ========== -->
        <div class="chat-container">
            <!-- 聊天消息显示区域 -->
            <div class="chat-box" id="chat-box">
                <!-- 欢迎消息 -->
                <div class="message bot-message welcome-message">
                    <div class="bot-content">
                        <p>欢迎使用AIoT智能体系统！</p>
                    </div>
                </div>
            </div>

            <!-- 输入控制区域 -->
            <div class="input-area">
                <!-- 问题输入框 -->
                <input type="text" id="question" placeholder="请输入您的问题..." autocomplete="off">
                <!-- 强制结束按钮 -->
                <button id="stop-btn" title="强制结束回答"></button>
                <!-- 语音控制按钮 -->
                <button id="voice-btn" title="语音开关/识别">🎤 语音 关</button>
                <!-- 发送按钮 -->
                <button id="send-btn" onclick="sendQuestion()">📤 发送</button>
            </div>
        </div>
    </div>

    <!-- 停止确认弹窗 -->
    <div id="stop-confirmation-modal" class="stop-confirmation-overlay" style="display: none;">
        <div class="stop-confirmation">
            <h3>⏹ 操作已停止</h3>
            <p>是否换一个问题？</p>
            <p class="voice-hint">🎤 也可以直接说"继续"或"取消"</p>
            <div class="confirmation-buttons">
                <button class="confirmation-btn confirm-yes" onclick="handleContinueCommand()">是</button>
                <button class="confirmation-btn confirm-no" onclick="handleCancelCommand()">否</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script>
        // Markdown（GFM 含表格）+ 安全过滤
        if (typeof marked !== 'undefined' && marked.use) {
            /* breaks: false 避免单换行变 <br>，减少多余空行 */
            marked.use({ gfm: true, breaks: false });
        }

        // ========== DOM元素获取 ==========
        const chatBox = document.getElementById('chat-box');        // 聊天框元素
        const questionInput = document.getElementById('question');   // 问题输入框
        const sendBtn = document.getElementById('send-btn');         // 发送按钮
        const voiceBtn = document.getElementById('voice-btn');       // 语音按钮
        const stopBtn = document.getElementById('stop-btn');         // 强制结束按钮
        const stopConfirmationModal = document.getElementById('stop-confirmation-modal'); // 停止确认弹窗

        // ========== 全局状态变量 ==========
        let isProcessing = false;            // 是否正在处理回答
        let currentAbortController = null;   // 当前请求的AbortController
        let agentSessionId = null;           // Agent会话ID
        let currentThinkingId = null;        // 当前思考中消息的ID
        let stopConfirmationShown = false;   // 是否已显示停止确认
        
        // 语音功能状态变量
        let silenceTimerId = null;           // 语音监听的静音超时定时器
        let awaitingSpeech = false;           // 是否在等待语音输入
        let voiceControlEnabled = false;      // 语音控制是否启用
        let isListeningForCommand = false;    // 是否正在监听语音指令
        let commandRecognition = null;       // 语音指令识别实例
        let confirmationRecognition = null;   // 确认弹窗专用语音识别实例
        let isListeningForConfirmation = false; // 是否正在监听确认指令
        
        // ========== 语音功能模块 ==========
        // 检查浏览器是否支持语音识别API
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const hasRecognition = !!SpeechRecognition;  // 是否支持语音识别
        const hasTTS = 'speechSynthesis' in window;  // 是否支持语音合成

        // 语音功能状态变量
        let speechEnabled = false;   // 语音功能总开关
        let recognizing = false;     // 是否正在听写状态
        let recognition = null;      // 语音识别实例
        
        // 启动识别并设置静音超时
        function startListeningWithSilenceTimeout(timeoutMs = 5000) {
            if (!speechEnabled) return;
            if (!hasRecognition) return;
            if (!recognition) return;
            try {
                if (silenceTimerId) {
                    clearTimeout(silenceTimerId);
                    silenceTimerId = null;
                }
                awaitingSpeech = true;
                recognition.start();
                silenceTimerId = setTimeout(() => {
                    if (awaitingSpeech && recognizing) {
                        try { recognition.stop(); } catch (e) { console.warn(e); }
                    }
                    awaitingSpeech = false;
                    silenceTimerId = null;
                }, timeoutMs);
            } catch (e) {
                console.warn(e);
            }
        }
        
        function clearSilenceTimer() {
            if (silenceTimerId) {
                clearTimeout(silenceTimerId);
                silenceTimerId = null;
            }
        }

        /**
         * 更新语音按钮的显示状态
         */
        function updateVoiceBtn() {
            if (!speechEnabled) {
                voiceBtn.textContent = '🎤 语音 关';
                voiceBtn.classList.remove('listening');
            } else if (recognizing) {
                voiceBtn.textContent = '🎤 停止听';
                voiceBtn.classList.add('listening');
            } else {
                voiceBtn.textContent = '🎤 开始听';
                voiceBtn.classList.remove('listening');
            }
            
            if (!hasRecognition && !hasTTS) {
                voiceBtn.textContent = '🎤 语音不可用';
                voiceBtn.classList.add('disabled');
            }
        }

        /**
         * 初始化语音识别功能
         */
        function initRecognition() {
            if (!hasRecognition) return;
            if (recognition) return;
            
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                recognizing = true;
                updateVoiceBtn();
            };
            
            recognition.onerror = (e) => {
                recognizing = false;
                awaitingSpeech = false;
                clearSilenceTimer();
                updateVoiceBtn();
                console.error('Speech recognition error:', e);
            };
            
            recognition.onend = () => {
                recognizing = false;
                awaitingSpeech = false;
                clearSilenceTimer();
                updateVoiceBtn();
            };
            
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                if (transcript) {
                    awaitingSpeech = false;
                    clearSilenceTimer();
                    questionInput.value = transcript;
                    sendQuestion();
                }
            };
        }

        /**
         * 初始化确认弹窗专用语音识别功能
         */
        function initConfirmationRecognition() {
            if (!hasRecognition) return;
            if (confirmationRecognition) return;
            
            confirmationRecognition = new SpeechRecognition();
            confirmationRecognition.lang = 'zh-CN';
            confirmationRecognition.continuous = true;
            confirmationRecognition.interimResults = true;
            
            confirmationRecognition.onstart = () => {
                isListeningForConfirmation = true;
                console.log('确认弹窗：开始监听语音指令');
            };
            
            confirmationRecognition.onerror = (e) => {
                isListeningForConfirmation = false;
                console.error('确认弹窗语音识别错误:', e);
            };
            
            confirmationRecognition.onend = () => {
                isListeningForConfirmation = false;
                console.log('确认弹窗：语音指令监听结束');
            };
            
            confirmationRecognition.onresult = (event) => {
                let finalTranscript = '';
                let interimTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript;
                    } else {
                        interimTranscript += transcript;
                    }
                }
                
                const fullTranscript = (finalTranscript + interimTranscript).toLowerCase().trim();
                console.log('确认弹窗语音识别结果:', fullTranscript);
                
                if (fullTranscript.includes('是') || fullTranscript.includes('继续') || fullTranscript.includes('下一个')) {
                    console.log('确认弹窗：收到"是"指令');
                    handleContinueCommand();
                } else if (fullTranscript.includes('否') || fullTranscript.includes('停止') || fullTranscript.includes('关闭') || fullTranscript.includes('取消')) {
                    console.log('确认弹窗：收到"否"指令');
                    handleCancelCommand();
                }
            };
        }

        /**
         * 开始确认弹窗语音监听
         */
        function startConfirmationListening() {
            if (!hasRecognition || !confirmationRecognition) {
                initConfirmationRecognition();
            }
            
            if (confirmationRecognition && !isListeningForConfirmation) {
                try {
                    confirmationRecognition.start();
                    console.log('确认弹窗语音监听已启动');
                } catch (e) {
                    console.warn('启动确认弹窗语音监听失败:', e);
                }
            }
        }

        /**
         * 停止确认弹窗语音监听
         */
        function stopConfirmationListening() {
            if (confirmationRecognition && isListeningForConfirmation) {
                try {
                    confirmationRecognition.stop();
                    isListeningForConfirmation = false;
                    console.log('确认弹窗语音监听已停止');
                } catch (e) {
                    console.warn('停止确认弹窗语音监听失败:', e);
                }
            }
        }

        /**
         * 初始化语音指令识别功能
         */
        function initCommandRecognition() {
            if (!hasRecognition) return;
            if (commandRecognition) return;
            
            commandRecognition = new SpeechRecognition();
            commandRecognition.lang = 'zh-CN';
            commandRecognition.continuous = true;
            commandRecognition.interimResults = true;
            
            commandRecognition.onstart = () => {
                isListeningForCommand = true;
                console.log('开始监听语音指令');
            };
            
            commandRecognition.onerror = (e) => {
                isListeningForCommand = false;
                console.error('语音指令识别错误:', e);
            };
            
            commandRecognition.onend = () => {
                isListeningForCommand = false;
                console.log('语音指令监听结束');
            };
            
            commandRecognition.onresult = (event) => {
                let finalTranscript = '';
                let interimTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript;
                    } else {
                        interimTranscript += transcript;
                    }
                }
                
                const fullTranscript = (finalTranscript + interimTranscript).toLowerCase().trim();
                console.log('语音指令识别结果:', fullTranscript);
                
                if (fullTranscript.includes('结束问答') || fullTranscript.includes('下个问题') || fullTranscript.includes('停止回答')) {
                    console.log('收到"停止"指令');
                    handleStopCommand();
                }
            };
        }

        /**
         * 开始监听语音指令
         */
        function startCommandListening() {
            if (!hasRecognition || !commandRecognition) {
                initCommandRecognition();
            }
            
            if (commandRecognition && !isListeningForCommand) {
                try {
                    commandRecognition.start();
                    voiceControlEnabled = true;
                    console.log('语音控制已启用');
                } catch (e) {
                    console.warn('启动语音指令监听失败:', e);
                }
            }
        }

        /**
         * 停止监听语音指令
         */
        function stopCommandListening() {
            if (commandRecognition && isListeningForCommand) {
                try {
                    commandRecognition.stop();
                    voiceControlEnabled = false;
                    isListeningForCommand = false;
                    console.log('语音控制已停用');
                } catch (e) {
                    console.warn('停止语音指令监听失败:', e);
                }
            }
        }

        /**
         * 处理"停止"指令
         */
        function handleStopCommand() {
            console.log('收到停止指令');
            
            if (hasTTS) {
                window.speechSynthesis.cancel();
            }
            
            if (hasRecognition && recognition && recognizing) {
                try {
                    recognition.stop();
                } catch (e) {
                    console.warn('停止语音识别失败:', e);
                }
            }
            
            if (currentAbortController) {
                currentAbortController.abort();
                currentAbortController = null;
            }
            
            if (currentThinkingId) {
                const thinkingElement = document.getElementById(currentThinkingId);
                if (thinkingElement) {
                    thinkingElement.textContent = '⏹ 思考已停止';
                }
                currentThinkingId = null;
            }
            
            stopCommandListening();
            showStopConfirmation();
        }

        /**
         * 处理"是"或"继续"指令
         */
        function handleContinueCommand() {
            console.log('收到继续指令');
            hideStopConfirmation();
            
            speechEnabled = true;
            if (hasRecognition) {
                initRecognition();
            }
            
            if (hasRecognition && recognition) {
                startListeningWithSilenceTimeout(10000);
            }
            
            updateVoiceBtn();
        }

        /**
         * 处理"否"指令
         */
        function handleCancelCommand() {
            console.log('收到取消指令');
            hideStopConfirmation();
            
            speechEnabled = false;
            recognizing = false;
            awaitingSpeech = false;
            clearSilenceTimer();
            
            updateVoiceBtn();
        }

        /**
         * 显示停止确认弹窗
         */
        function showStopConfirmation() {
            if (stopConfirmationShown) return;
            
            stopConfirmationShown = true;
            stopConfirmationModal.style.display = 'flex';
            
            questionInput.disabled = false;
            sendBtn.disabled = false;
            questionInput.focus();
            
            isProcessing = false;
            currentAbortController = null;
            
            stopBtn.style.display = 'none';
            
            if (hasRecognition) {
                startConfirmationListening();
                
                if (hasTTS) {
                    setTimeout(() => {
                        const hintUtter = new SpeechSynthesisUtterance('请说"继续"或"取消"');
                        hintUtter.lang = 'zh-CN';
                        hintUtter.rate = 0.8;
                        hintUtter.volume = 0.5;
                        window.speechSynthesis.speak(hintUtter);
                    }, 500);
                }
            }
            
            console.log('显示停止确认弹窗');
        }

        /**
         * 隐藏停止确认弹窗
         */
        function hideStopConfirmation() {
            if (!stopConfirmationShown) return;
            
            stopConfirmationShown = false;
            stopConfirmationModal.style.display = 'none';
            
            stopConfirmationListening();
            
            console.log('隐藏停止确认弹窗');
        }

        /**
         * 切换语音功能状态
         */
        function toggleVoice() {
            if (!speechEnabled) {
                speechEnabled = true;
                if (hasRecognition) initRecognition();
                updateVoiceBtn();
                return;
            }
            
            if (hasRecognition && recognition) {
                if (!recognizing) {
                    try { 
                        recognition.start(); 
                    } catch (e) { 
                        console.warn(e); 
                    }
                } else {
                    try { 
                        recognition.stop(); 
                    } catch (e) { 
                        console.warn(e); 
                    }
                }
            }
            updateVoiceBtn();
        }

        // 语音按钮点击事件监听
        voiceBtn.addEventListener('click', () => {
            if (!hasRecognition && !hasTTS) return;
            toggleVoice();
        });

        /**
         * 语音合成朗读功能
         */
        function speak(text) {
            if (!speechEnabled) return;
            if (!hasTTS) return;
            if (!text || !text.trim()) return;
            console.log("语音播报内容：", text)

            try {
                window.speechSynthesis.cancel();
                
                stopBtn.style.display = 'inline-block';
                console.log('显示停止按钮 - 开始语音播放');
                
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'zh-CN';
                utter.rate = 1.0;
                utter.pitch = 1.0;
                
                utter.onstart = function() {
                    console.log('语音播放开始');
                    stopBtn.style.display = 'inline-block';
                    
                    if (speechEnabled && hasRecognition) {
                        initCommandRecognition();
                        setTimeout(() => {
                            startCommandListening();
                        }, 200);
                    }
                };
                
                utter.onend = function() {
                    console.log('语音播放结束');
                    stopBtn.style.display = 'none';
                    console.log('隐藏停止按钮 - 语音播放结束');
                    
                    stopCommandListening();
                    
                    if (speechEnabled && hasRecognition && recognition) {
                        startListeningWithSilenceTimeout(10000);
                    }
                };
                
                utter.onerror = function(event) {
                    console.warn('语音播放错误:', event.error);
                    stopBtn.style.display = 'none';
                    console.log('隐藏停止按钮 - 语音播放错误');
                    
                    stopCommandListening();
                };
                
                window.speechSynthesis.speak(utter);
                console.log('开始语音播放:', text.substring(0, 50) + '...');
            } catch (e) {
                console.warn('TTS error:', e);
                stopBtn.style.display = 'none';
                console.log('隐藏停止按钮 - 语音合成异常');
            }
        }

        /**
         * 强制停止所有回答功能
         */
        function forceStopAnswer() {
            if (hasTTS) {
                window.speechSynthesis.cancel();
                console.log('语音播放已停止');
            }
            
            if (hasRecognition && recognition && recognizing) {
                try {
                    recognition.stop();
                    console.log('语音识别已停止');
                } catch (e) {
                    console.warn('Stop recognition error:', e);
                }
            }
            
            if (currentAbortController) {
                currentAbortController.abort();
                currentAbortController = null;
                console.log('网络请求已取消');
            }
            
            awaitingSpeech = false;
            clearSilenceTimer();
            
            stopCommandListening();
            
            isProcessing = false;
            
            stopBtn.style.display = 'none';
            console.log('隐藏停止按钮 - 强制停止');
            
            questionInput.disabled = false;
            sendBtn.disabled = false;
            questionInput.focus();
            
            updateVoiceBtn();
            
            // 强制结束：仅中止当前回答，保留同一 opencode 会话（不删会话、不建新会话）
            console.log('强制结束回答：已保留当前会话', { sessionId: agentSessionId });
        }

        // 强制结束按钮点击事件监听
        stopBtn.addEventListener('click', forceStopAnswer);

        // ========== Agent会话管理 ==========
        /**
         * 创建Agent会话
         */
        function createAgentSession() {
            return fetch('{% url "agent_session_create" %}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken') || ''
                },
                body: JSON.stringify({ title: '智能体问答会话' })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    agentSessionId = data.session_id;
                    console.log('Agent会话已创建:', agentSessionId);
                    return agentSessionId;
                } else {
                    throw new Error(data.error || '创建会话失败');
                }
            });
        }

        /**
         * 删除Agent会话
         */
        function deleteAgentSession() {
            if (!agentSessionId) return Promise.resolve();
            
            return fetch('{% url "agent_session_delete" %}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken') || ''
                },
                body: JSON.stringify({ session_id: agentSessionId })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    console.log('Agent会话已删除:', agentSessionId);
                    agentSessionId = null;
                }
            })
            .catch(error => {
                console.error('删除会话失败:', error);
            });
        }

        // ========== 消息管理 ==========
        /**
         * 添加消息到聊天框
         */
        function addMessage(sender, content, id = '', isThinking = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            if (id) messageDiv.id = id;

            if (isThinking) {
                messageDiv.classList.add('thinking');
                messageDiv.innerHTML = content;
            } else {
                const contentDiv = document.createElement('div');
                contentDiv.className = sender === 'bot' ? 'bot-content' : '';
                contentDiv.innerHTML = sender === 'bot' ? formatResponse(content) : content;
                messageDiv.appendChild(contentDiv);
            }

            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return messageDiv;
        }

        /**
         * 转义HTML特殊字符
         */
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        /**
         * 将 Markdown 转为安全 HTML（模型输出经 DOMPurify 过滤）
         */
        function renderMarkdown(md) {
            if (md == null || md === '') return '';
            const s = String(md);
            try {
                if (typeof marked !== 'undefined' && typeof marked.parse === 'function') {
                    const raw = marked.parse(s, { async: false });
                    if (typeof DOMPurify !== 'undefined' && typeof DOMPurify.sanitize === 'function') {
                        return DOMPurify.sanitize(raw);
                    }
                    return raw;
                }
            } catch (e) {
                console.warn('Markdown 渲染失败:', e);
            }
            return escapeHtml(s).replace(/\n/g, '<br>');
        }

        /**
         * 组装 Agent 流式/最终气泡：思考过程为纯文本，回答区为 Markdown
         */
        function buildAgentReplyHtml(reasoningPlain, answerMd) {
            const parts = [];
            if (reasoningPlain) {
                parts.push(
                    '<div class="reasoning-section"><strong>[思考过程]</strong>' +
                    escapeHtml(reasoningPlain).replace(/\n/g, '<br>') +
                    '</div>'
                );
            }
            if (answerMd) {
                parts.push(
                    '<div class="text-section"><strong>[回答]</strong>' +
                    '<div class="markdown-body">' + renderMarkdown(answerMd) + '</div></div>'
                );
            }
            return parts.join('');
        }

        /**
         * 格式化AI回复内容
         */
        function formatResponse(text) {
            let formatted = text.replace(/\n/g, '<br>');

            formatted = formatted.replace(/```(\w*)\n([\s\S]*?)\n```/g,
                '<pre><code class="$1">$2</code></pre>');

            formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');

            formatted = formatted.replace(/^\s*\*\s(.*)$/gm, '<li>$1</li>');
            formatted = formatted.replace(/^\s*-\s(.*)$/gm, '<li>$1</li>');
            formatted = formatted.replace(/^\s*\d+\.\s(.*)$/gm, '<li>$1</li>');

            formatted = formatted.replace(/(<li>.*<\/li>)+/g, function(match) {
                return '<ul>' + match + '</ul>';
            });

            formatted = formatted.replace(/^>\s(.*)$/gm, '<blockquote>$1</blockquote>');

            formatted = formatted.replace(/^#\s(.*)$/gm, '<h1>$1</h1>');
            formatted = formatted.replace(/^##\s(.*)$/gm, '<h2>$1</h2>');
            formatted = formatted.replace(/^###\s(.*)$/gm, '<h3>$1</h3>');

            formatted = formatted.replace(/<br><br>/g, '</p><p>');
            formatted = '<p>' + formatted + '</p>';

            return formatted;
        }

        /**
         * 将 AI 原始回复转换为适合 TTS 的纯文本
         */
        function toSpeechText(raw) {
            let t = raw.replace(/```[\s\S]*?```/g, '[代码片段略]');
            t = t.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '$1');
            t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1');
            t = t.replace(/`([^`]+)`/g, '$1');
            t = t.replace(/(\*\*|__)(.*?)\1/g, '$2')
                 .replace(/(\*|_)(.*?)\1/g, '$2');
            t = t.replace(/^\s{0,3}#{1,6}\s*/gm, '')
                 .replace(/^\s{0,3}>\s?/gm, '')
                 .replace(/^\s*([-*+]\s+|\d+\.\s+)/gm, '• ');
            t = t.replace(/<br\s*\/?>/gi, '\n');
            t = stripHTMLTags(t);
            t = t.replace(/\u00A0/g, ' ')
                 .replace(/[ \t]+/g, ' ')
                 .replace(/\n{3,}/g, '\n\n')
                 .trim();

            const MAX_CHARS = 4000;
            return t.length > MAX_CHARS ? t.slice(0, MAX_CHARS) + ' …' : t;
        }

        /** 移除 HTML 标签并解码 HTML 实体 */
        function stripHTMLTags(html) {
            const div = document.createElement('div');
            div.innerHTML = html;
            return div.textContent || div.innerText || '';
        }

        /**
         * 发送问题到Agent并处理回复
         */
        function sendQuestion() {
            const question = questionInput.value.trim();
            if (!question) return;

            if (!agentSessionId) {
                addMessage('bot', '❌ 会话未就绪，请稍候...');
                createAgentSession().then(() => {
                    sendQuestion();
                }).catch(error => {
                    addMessage('bot', '❌ 创建会话失败: ' + error.message);
                });
                return;
            }

            isProcessing = true;

            questionInput.disabled = true;
            sendBtn.disabled = true;
            
            stopBtn.style.display = 'inline-block';

            addMessage('user', question);
            questionInput.value = '';

            const thinkingId = 'thinking-' + Date.now();
            currentThinkingId = thinkingId;
            addMessage('bot', '🤔 思考中<span class="loading-dots"></span>', thinkingId, true);

            chatBox.scrollTop = chatBox.scrollHeight;

            if (speechEnabled && hasRecognition) {
                startCommandListening();
            }

            currentAbortController = new AbortController();

            // 创建消息气泡用于显示流式内容
            const thinkingElement = document.getElementById(thinkingId);
            let botMessageId = 'bot-msg-' + Date.now();
            let botMessageEl = null;
            let reasoningContent = '';
            let textContent = '';

            fetch('{% url "agent_session_send" %}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken') || ''
                },
                body: JSON.stringify({ 
                    session_id: agentSessionId,
                    message: question 
                }),
                signal: currentAbortController.signal
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                // 移除思考中消息
                if (thinkingElement) {
                    thinkingElement.remove();
                }
                
                // 创建新的消息气泡
                botMessageEl = addMessage('bot', '', botMessageId);
                const contentDiv = botMessageEl.querySelector('.bot-content') || botMessageEl.querySelector('div');
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                
                // ========== 结束判定优化 ==========
                // 后端可能先发 finish/finished，再补发少量 text/reasoning；这里改为“待结束”状态，直到内容稳定不再增长才真正结束，避免截断。
                const END_STABLE_MS = 700;      // 多久无增长判定稳定
                const END_CHECK_INTERVAL_MS = 200;
                const END_MAX_WAIT_MS = 10000;  // 最长等待，避免流异常不结束
                let pendingEnd = false;
                let finalized = false;
                let finishDeadlineAt = 0;
                let lastTotalLen = 0;
                let lastGrowthAt = Date.now();
                let endCheckTimer = null;
                let finishPayload = null;

                function totalLen() {
                    return (reasoningContent ? reasoningContent.length : 0) + (textContent ? textContent.length : 0);
                }

                function noteGrowth() {
                    const nowLen = totalLen();
                    if (nowLen !== lastTotalLen) {
                        lastTotalLen = nowLen;
                        lastGrowthAt = Date.now();
                    }
                }

                function finalizeStream() {
                    if (finalized) return;
                    finalized = true;
                    if (endCheckTimer) {
                        try { clearTimeout(endCheckTimer); } catch (e) {}
                        endCheckTimer = null;
                    }

                    const finalReasoning = (finishPayload && finishPayload.reasoning != null) ? finishPayload.reasoning : reasoningContent;
                    const finalText = (finishPayload && finishPayload.text != null) ? finishPayload.text : textContent;
                    if (contentDiv) {
                        contentDiv.innerHTML = buildAgentReplyHtml(finalReasoning, finalText);
                    }

                    if (speechEnabled && hasTTS) {
                        setTimeout(() => {
                            const speechText = toSpeechText(finalText);
                            console.log("语音播报内容：", speechText);
                            speak(speechText);
                        }, 100);
                    }

                    chatBox.scrollTop = chatBox.scrollHeight;
                    try { reader.cancel(); } catch (e) {}
                }

                function scheduleEndCheck() {
                    if (finalized) return;
                    if (!pendingEnd) return;
                    if (endCheckTimer) return;

                    endCheckTimer = setTimeout(function tick() {
                        endCheckTimer = null;
                        if (finalized) return;
                        if (!pendingEnd) return;

                        noteGrowth();
                        const now = Date.now();
                        const stable = (now - lastGrowthAt) >= END_STABLE_MS;
                        const deadlineHit = finishDeadlineAt > 0 && now >= finishDeadlineAt;
                        if (stable || deadlineHit) {
                            finalizeStream();
                            return;
                        }
                        scheduleEndCheck();
                    }, END_CHECK_INTERVAL_MS);
                }

                function readStream() {
                    return reader.read().then(({ done, value }) => {
                        if (done) {
                            // 流已结束：若已进入待结束但仍未 finalize，直接 finalize
                            if (pendingEnd && !finalized) {
                                finalizeStream();
                            }
                            return;
                        }

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop() || '';

                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                try {
                                    const data = JSON.parse(line.slice(6));
                                    
                                    if (data.type === 'reasoning') {
                                        reasoningContent += data.content;
                                        noteGrowth();
                                        if (contentDiv) {
                                            contentDiv.innerHTML = buildAgentReplyHtml(reasoningContent, textContent);
                                        }
                                        chatBox.scrollTop = chatBox.scrollHeight;
                                    } else if (data.type === 'text') {
                                        const delta = (data.content !== undefined && data.content !== null)
                                            ? data.content
                                            : (data.text || '');
                                        textContent += delta;
                                        noteGrowth();
                                        if (contentDiv) {
                                            contentDiv.innerHTML = buildAgentReplyHtml(reasoningContent, textContent);
                                        }
                                        chatBox.scrollTop = chatBox.scrollHeight;
                                    } else if (data.type === 'finish' || data.type === 'finished') {
                                        // 不再立刻结束：进入“待结束”并继续读取，直到内容稳定不再增长
                                        pendingEnd = true;
                                        finishPayload = data || finishPayload;
                                        finishDeadlineAt = Date.now() + END_MAX_WAIT_MS;
                                        noteGrowth();
                                        scheduleEndCheck();
                                    } else if (data.type === 'error') {
                                        if (contentDiv) {
                                            contentDiv.innerHTML = '❌ 错误: ' + escapeHtml(data.error);
                                        }
                                        throw new Error(data.error);
                                    }
                                } catch (e) {
                                    console.error('解析SSE数据失败:', e);
                                }
                            }
                        }

                        return readStream();
                    });
                }

                return readStream();
            })
            .then(() => {
                stopCommandListening();
                currentThinkingId = null;
            })
            .catch(error => {
                if (error.name === 'AbortError') {
                    console.log('请求已被用户取消');
                    if (thinkingElement && thinkingElement.parentNode) {
                        thinkingElement.textContent = '⏹ 回答已停止';
                    } else if (botMessageEl) {
                        const contentDiv = botMessageEl.querySelector('.bot-content') || botMessageEl.querySelector('div');
                        if (contentDiv) {
                            contentDiv.innerHTML = '⏹ 回答已停止';
                        }
                    }
                } else {
                    console.error('Error:', error);
                    if (thinkingElement && thinkingElement.parentNode) {
                        thinkingElement.textContent = '❌ 请求出错: ' + error.message;
                    } else if (botMessageEl) {
                        const contentDiv = botMessageEl.querySelector('.bot-content') || botMessageEl.querySelector('div');
                        if (contentDiv) {
                            contentDiv.innerHTML = '❌ 请求出错: ' + escapeHtml(error.message);
                        }
                    } else {
                        addMessage('bot', '❌ 请求出错: ' + error.message);
                    }
                }
            })
            .finally(() => {
                isProcessing = false;
                currentAbortController = null;
                currentThinkingId = null;
                
                stopCommandListening();
                
                stopBtn.style.display = 'none';
                
                questionInput.disabled = false;
                sendBtn.disabled = false;
                questionInput.focus();
                
                updateVoiceBtn();
            });
        }

        /**
         * 获取Cookie值的辅助函数
         */
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // ========== 键盘事件监听 ==========
        questionInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendQuestion();
            }
        });

        // ========== 页面初始化 ==========
        // 页面加载时创建Agent会话
        createAgentSession().catch(error => {
            console.error('创建Agent会话失败:', error);
            addMessage('bot', '❌ 初始化失败: ' + error.message);
        });

        // 页面卸载时删除Agent会话
        window.addEventListener('beforeunload', function() {
            deleteAgentSession();
        });

        // 初始化语音按钮状态
        updateVoiceBtn();
    </script>
</body>
</html>
