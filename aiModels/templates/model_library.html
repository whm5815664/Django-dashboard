{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型库</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.2) 0%, transparent 50%);
            animation: backgroundShift 20s ease-in-out infinite;
            z-index: -1;
        }
        @keyframes backgroundShift {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-container { display: flex; align-items: center; gap: 15px; }
        .logo {
            width: 64px;
            height: 64px;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(120, 219, 255, 0.5));
            transition: all 0.3s ease;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px;
            backdrop-filter: blur(10px);
        }
        .system-title {
            font-size: 1.6em;
            font-weight: 700;
            background: linear-gradient(135deg, #78dfff, #ff77c6, #7877c6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(120, 219, 255, 0.5);
        }
        .back-button a {
            color: #ffffff;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            transition: transform 0.15s ease, background 0.15s ease;
        }
        .back-button a:hover { transform: scale(1.03); background: rgba(255, 255, 255, 0.12); }

        .panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            padding: 20px;
        }

        .panel-title {
            font-size: 1.2em;
            margin-bottom: 14px;
            font-weight: 700;
        }

        .model-select-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }
        .model-select {
            flex: 1;
            min-width: 260px;
            height: 42px;
            border-radius: 14px;
            padding: 0 14px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #ffffff;
            outline: none;
        }
        .action-btn {
            height: 42px;
            padding: 0 18px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(120, 223, 255, 0.9), rgba(255, 119, 198, 0.9));
            color: #0b1020;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .action-btn:hover { transform: translateY(-1px); filter: brightness(1.05); }

        .model-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }
        @media (max-width: 900px) {
            .model-grid { grid-template-columns: 1fr; }
        }

        .model-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-decoration: none;
            color: #ffffff;
            transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
        }
        .model-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.18);
        }

        .model-card .name {
            font-size: 1.05em;
            font-weight: 800;
        }
        .model-card .desc {
            opacity: 0.92;
            line-height: 1.5;
            min-height: 40px;
        }
        .model-card .enter {
            margin-top: auto;
            align-self: flex-start;
            padding: 9px 14px;
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(10px);
            font-weight: 700;
        }

        .hint {
            margin-top: 10px;
            opacity: 0.86;
            font-size: 0.95em;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="top-nav">
            <div class="logo-container">
                <img src="{% static 'images/AIoT实验室LOGO.png' %}" alt="AIoT实验室" class="logo">
                <div class="system-title">模型库</div>
            </div>
            <div class="back-button">
                <a href="javascript:history.back()">返回</a>
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">选择一个模型系统</div>

            <div class="model-select-row">
                <select id="modelSelect" class="model-select">
                    <option value="">请选择模型</option>
                    <option value="{% url 'chat' %}">农业大模型问答系统</option>
                    <option value="{% url 'graph' %}">农业文本知识图谱抽取系统</option>
                    <option value="{% url 'upload' %}">病虫害识别系统</option>
                </select>
                <button class="action-btn" type="button" onclick="jumpToModel()">进入</button>
            </div>

            <div class="hint">也可以直接点击下方卡片快速进入。</div>

            <div class="model-grid" style="margin-top: 14px;">
                <a class="model-card" href="{% url 'chat' %}">
                    <div class="name">农业大模型问答</div>
                    <div class="desc">基于 DeepSeek-R1 的农业问答对话能力。</div>
                    <div class="enter">进入</div>
                </a>

                <a class="model-card" href="{% url 'graph' %}">
                    <div class="name">知识图谱抽取</div>
                    <div class="desc">对农业文本进行知识图谱抽取与可视化展示。</div>
                    <div class="enter">进入</div>
                </a>

                <a class="model-card" href="{% url 'upload' %}">
                    <div class="name">病虫害识别</div>
                    <div class="desc">上传图片进行病虫害识别与结果展示。</div>
                    <div class="enter">进入</div>
                </a>
            </div>
        </div>
    </div>

    <script>
        function jumpToModel() {
            var select = document.getElementById('modelSelect');
            var url = select.value;
            if (!url) return;
            window.location.href = url;
        }
    </script>
</body>
</html>
