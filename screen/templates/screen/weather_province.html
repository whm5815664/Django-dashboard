<!DOCTYPE html>
<html lang="zh-CN">
<head>
  {% load static %}
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>全国省份气象监测</title>
  <style>
    :root {
      --bg0: #070f1a;
      --bg1: #0b1626;
      --card: rgba(15, 34, 56, 0.82);
      --border: rgba(27, 58, 91, 0.55);
      --text: #d7e6ff;
      --muted: #8fb1d4;
      --accent: #34d399;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 800px at 50% -200px, rgba(52,211,255,.18), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      display: flex;
      flex-direction: column;
    }

    header {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 200px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(15,34,56,.75), rgba(15,34,56,.2));
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand img { height: 38px; }
    header h1 {
      text-align: center;
      font-size: 20px;
      letter-spacing: 3px;
      font-weight: 700;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-self: end;
    }
    .header-time { font-size: 13px; color: var(--muted); white-space: nowrap; }
    .btn-refresh {
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      background: rgba(52,211,255,.08);
      border: 1px solid rgba(52,211,255,.25);
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .btn-refresh:hover { color: var(--text); border-color: rgba(52,211,255,.5); }

    .main-layout {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 380px;
      grid-template-rows: 1fr auto;
      gap: 12px;
      padding: 12px;
    }

    .map-panel {
      grid-row: 1 / 3;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-head {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      color: var(--muted);
    }
    .panel-head b { color: var(--text); }
    #chinaMap { flex: 1; min-height: 0; }
    .map-layer-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      background: rgba(0,0,0,.12);
    }
    .map-layer-bar .layer-label {
      font-size: 12px;
      color: var(--muted);
      margin-right: 4px;
    }
    .layer-btn {
      padding: 5px 14px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      background: rgba(52,211,255,.06);
      border: 1px solid rgba(27,58,91,.55);
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: color .15s, border-color .15s, background .15s;
    }
    .layer-btn:hover {
      color: var(--text);
      border-color: rgba(52,211,255,.45);
    }
    .layer-btn.active {
      color: var(--text);
      background: rgba(52,211,255,.16);
      border-color: rgba(52,211,255,.55);
    }

    .weather-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }
    .weather-detail {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }
    .weather-hero {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px;
      background: rgba(52,211,255,.06);
      border-radius: 10px;
      border: 1px solid rgba(52,211,255,.15);
    }
    .weather-hero img { width: 80px; height: 80px; }
    .weather-hero .temp {
      font-size: 48px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }
    .weather-hero .temp span { font-size: 22px; }
    .weather-hero .desc { font-size: 16px; margin-top: 4px; }
    .weather-hero .city { font-size: 13px; color: var(--muted); margin-top: 2px; }

    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .metric-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: rgba(0,0,0,.22);
      border-radius: 10px;
      border: 1px solid rgba(27,58,91,.4);
    }
    .metric-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .metric-icon.humidity { background: rgba(59,130,246,.2); }
    .metric-icon.wind { background: rgba(168,85,247,.2); }
    .metric-icon.pressure { background: rgba(245,158,11,.2); }
    .metric-icon.visibility { background: rgba(34,211,238,.2); }
    .metric-icon.clouds { background: rgba(148,163,184,.2); }
    .metric-icon.feels { background: rgba(239,68,68,.2); }
    .metric-label { font-size: 11px; color: var(--muted); }
    .metric-value { font-size: 16px; font-weight: 600; margin-top: 2px; }

    .bottom-panel {
      grid-column: 2;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      min-height: 200px;
      max-height: 220px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .bottom-panel h3 {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px;
      font-weight: 500;
    }
    .bottom-panel h3 b { color: var(--text); }
    .forecast-strip {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
      flex: 1;
      scrollbar-width: thin;
      scrollbar-color: rgba(52,211,255,.4) transparent;
    }
    .forecast-strip::-webkit-scrollbar { height: 4px; }
    .forecast-strip::-webkit-scrollbar-thumb {
      background: rgba(52,211,255,.4);
      border-radius: 4px;
    }
    .forecast-card {
      flex: 0 0 168px;
      padding: 10px 12px;
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(27,58,91,.45);
      border-radius: 10px;
    }
    .forecast-card .date {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }
    .forecast-card .date .tag {
      margin-left: 6px;
      font-size: 11px;
      color: #34d3ff;
      font-weight: 600;
    }
    .forecast-slot { margin-top: 8px; }
    .forecast-slot:first-of-type { margin-top: 0; }
    .forecast-slot .label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .forecast-slot .info {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.45;
    }
    .forecast-slot .info img {
      width: 28px;
      height: 28px;
      vertical-align: middle;
      margin-right: 4px;
    }
    .forecast-divider {
      margin: 8px 0;
      border-top: 1px dashed rgba(27,58,91,.35);
    }

    .empty-hint {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 16px;
      line-height: 1.6;
    }
    .loading { opacity: .5; pointer-events: none; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="{% static 'images/AIoT实验室LOGO.png' %}" alt="AIoT" />
    </div>
    <h1>全国省份气象监测大屏</h1>
    <div class="header-right">
      <button type="button" class="btn-refresh" id="refreshBtn">刷新天气</button>
      <div class="header-time" id="clock">—</div>
    </div>
  </header>

  <div class="main-layout">
    <div class="map-panel">
      <div class="panel-head">点击省份选择 <b id="selectedProvinceLabel">湖北</b></div>
      <div id="chinaMap"></div>
      <div class="map-layer-bar">
        <span class="layer-label">图层</span>
        <button type="button" class="layer-btn active" data-layer="temperature">温度</button>
        <button type="button" class="layer-btn" data-layer="humidity">湿度</button>
        <button type="button" class="layer-btn" data-layer="rainfall">降雨</button>
      </div>
    </div>

    <div class="weather-panel">
      <div class="panel-head">实时监测 · <b id="loadedProvinceLabel">—</b></div>
      <div class="weather-detail" id="weatherDetail">
        <div class="empty-hint">正在加载天气数据…</div>
      </div>
    </div>

    <div class="bottom-panel">
      <h3><b id="forecastProvinceLabel">—</b> · 未来 3 天预报</h3>
      <div class="forecast-strip" id="forecastStrip">
        <div class="empty-hint">暂无预报数据</div>
      </div>
    </div>
  </div>

  <script src="{% static 'js/echarts.min.js' %}"></script>
  <script src="{% static 'js/china.js' %}"></script>
  <script src="{% static 'js/weather_province_map.js' %}"></script>
  <script>
    (function () {
      var API = {
        overview: "{% url 'weather_provinces_overview' %}",
      };
      var DEFAULT_PROVINCE = "湖北";

      var state = {
        selected: DEFAULT_PROVINCE,
        loaded: "",
        overview: [],
        provincesCache: {},
        updateTime: "",
        map: null,
      };

      function tick() {
        var d = new Date();
        document.getElementById("clock").textContent =
          d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日 " +
          String(d.getHours()).padStart(2, "0") + ":" +
          String(d.getMinutes()).padStart(2, "0") + ":" +
          String(d.getSeconds()).padStart(2, "0");
      }
      tick();
      setInterval(tick, 1000);

      function esc(s) {
        if (s == null) return "—";
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function setLoading(on) {
        document.body.classList.toggle("loading", on);
      }

      function renderDetail(data) {
        var el = document.getElementById("weatherDetail");
        if (!data) {
          el.innerHTML = '<div class="empty-hint">暂无天气数据<br/>请点击顶部「刷新天气」重新获取</div>';
          return;
        }
        el.innerHTML =
          '<div class="weather-hero">' +
            '<img src="' + esc(data.icon_url) + '" alt="" />' +
            '<div>' +
              '<div class="temp">' + esc(data.temperature) + '<span>°C</span></div>' +
              '<div class="desc">' + esc(data.description) + '</div>' +
              '<div class="city">' + esc(data.province) + ' · ' + esc(data.city) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="metric-grid">' +
            metricCard("💧", "humidity", "相对湿度", data.humidity + "%") +
            metricCard("🌡️", "feels", "体感温度", data.feels_like + "°C") +
            metricCard("💨", "wind", "风速 / 风向", data.wind_speed + " m/s · " + esc(data.wind_direction)) +
            metricCard("🔵", "pressure", "气压", data.pressure + " hPa") +
            metricCard("👁", "visibility", "能见度", (data.visibility / 1000).toFixed(1) + " km") +
            metricCard("☁️", "clouds", "云量", data.clouds + "%") +
          '</div>' +
          '<div style="font-size:11px;color:#8fb1d4;text-align:right;">更新: ' + esc(data.update_time) + '</div>';
      }

      function metricCard(icon, cls, label, value) {
        return '<div class="metric-card">' +
          '<div class="metric-icon ' + cls + '">' + icon + '</div>' +
          '<div><div class="metric-label">' + label + '</div>' +
          '<div class="metric-value">' + value + '</div></div></div>';
      }

      function renderForecast(province, list) {
        document.getElementById("forecastProvinceLabel").textContent = province || "—";
        var strip = document.getElementById("forecastStrip");
        if (!list || !list.length) {
          strip.innerHTML = '<div class="empty-hint">暂无预报数据<br/>请点击顶部「刷新天气」重新获取</div>';
          return;
        }
        strip.innerHTML = list.slice(0, 3).map(function (f, idx) {
          var tag = idx === 1 ? '<span class="tag">明日</span>' : "";
          return '<div class="forecast-card">' +
            '<div class="date">' + esc(f.date) + tag + '</div>' +
            '<div class="forecast-slot">' +
              '<div class="label">白天</div>' +
              '<div class="info">' +
                (f.dayIconUrl ? '<img src="' + esc(f.dayIconUrl) + '" alt="" />' : "") +
                esc(f.dayWeather) + ' ' + esc(f.dayTemp) + '°C<br/>' +
                '湿度 ' + esc(f.dayHumidity) + '% · 风 ' + esc(f.dayWindDir) + ' ' + esc(f.dayWindSpeed) + ' m/s' +
              '</div>' +
            '</div>' +
            '<div class="forecast-divider"></div>' +
            '<div class="forecast-slot">' +
              '<div class="label">夜间</div>' +
              '<div class="info">' +
                (f.nightIconUrl ? '<img src="' + esc(f.nightIconUrl) + '" alt="" />' : "") +
                esc(f.nightWeather) + ' ' + esc(f.nightTemp) + '°C<br/>' +
                '湿度 ' + esc(f.nightHumidity) + '% · 风 ' + esc(f.nightWindDir) + ' ' + esc(f.nightWindSpeed) + ' m/s' +
              '</div>' +
            '</div>' +
          '</div>';
        }).join("");
      }

      function showProvinceFromCache(province) {
        var cached = state.provincesCache[province];
        if (!cached) {
          renderDetail(null);
          renderForecast(province, null);
          document.getElementById("loadedProvinceLabel").textContent = "—";
          state.loaded = "";
          return;
        }
        state.loaded = province;
        document.getElementById("loadedProvinceLabel").textContent = province;
        renderDetail(cached.data);
        renderForecast(province, cached.forecast || []);
      }

      function updateSelectionUI(name) {
        state.selected = name;
        document.getElementById("selectedProvinceLabel").textContent = name;
        state.map && state.map.selectProvince(name);
        showProvinceFromCache(name);
      }

      function loadAllProvinces(forceRefresh) {
        var url = API.overview + (forceRefresh ? "?refresh=1" : "");
        setLoading(true);
        return fetch(url)
          .then(function (r) { return r.json(); })
          .then(function (res) {
            if (!res.success) throw new Error(res.error || "加载失败");
            state.overview = res.data || [];
            state.provincesCache = res.provinces || {};
            state.updateTime = res.update_time || "";
            state.map && state.map.updateMapData(state.overview);
            showProvinceFromCache(state.selected);
          })
          .catch(function (e) {
            console.error(e);
            renderDetail(null);
            renderForecast(state.selected, null);
          })
          .finally(function () { setLoading(false); });
      }

      function refreshAll(forceRefresh) {
        loadAllProvinces(!!forceRefresh);
      }

      function selectProvince(name) {
        if (!name) return;
        updateSelectionUI(name);
      }

      state.map = WeatherProvinceMap.init("chinaMap", {
        onProvinceSelect: selectProvince,
      });
      state.map && state.map.selectProvince(DEFAULT_PROVINCE);

      document.querySelectorAll(".layer-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var layer = btn.getAttribute("data-layer");
          if (!layer || !state.map) return;
          document.querySelectorAll(".layer-btn").forEach(function (b) {
            b.classList.toggle("active", b === btn);
          });
          state.map.setLayer(layer);
        });
      });

      document.getElementById("refreshBtn").addEventListener("click", function () {
        refreshAll(true);
      });

      // 首次进入：一次性获取全部省份气象并缓存到变量
      loadAllProvinces(false);
    })();
  </script>
</body>
</html>
